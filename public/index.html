<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netwatch</title>
<style>
:root{--bg:#0f1318;--panel:#171d25;--line:#263040;--fg:#d8e0ea;--mut:#7d8a9c;--hi:#ff5c5c;--med:#ffb04a;--low:#e6d46a;--ok:#4ac98a}
@media(prefers-color-scheme:light){:root{--bg:#f5f7fa;--panel:#fff;--line:#dde3ec;--fg:#1c2430;--mut:#667386}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;margin:0}.stat{color:var(--mut)}.stat b{color:var(--fg)}
input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.dot.on{background:var(--ok)}
main{padding:0 16px 24px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;color:var(--mut);font-weight:normal;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.s3{background:color-mix(in srgb,var(--hi) 14%,transparent)}tr.s2{background:color-mix(in srgb,var(--med) 11%,transparent)}tr.s1{background:color-mix(in srgb,var(--low) 8%,transparent)}
tr.closed{opacity:.5}
.tag{display:inline-block;padding:0 6px;border-radius:3px;margin:1px 2px 1px 0;font-size:11px;color:#111}
.tag.high{background:var(--hi)}.tag.med{background:var(--med)}.tag.low{background:var(--low)}
.mut{color:var(--mut)}.st{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.st.ESTAB{color:var(--ok)}
#alert{margin:12px 16px 0;padding:10px 12px;border:1px solid var(--hi);border-radius:6px;background:color-mix(in srgb,var(--hi) 14%,transparent)}
#alert b{color:var(--hi)}
.cloud{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:4px;color:var(--mut)}
.tag.feedhit{outline:2px solid var(--hi)}button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;cursor:pointer}button:hover{border-color:var(--hi)}</style></head><body>
<header>
 <h1>Netwatch</h1><span><span class="dot" id="dot"></span> <span id="conn">connecting</span></span>
 <span class="stat">sessions <b id="n">0</b></span><span class="stat">external <b id="ne">0</b></span>
 <span class="stat">flagged <b id="nf" style="color:var(--hi)">0</b></span>
 <span class="stat" id="feeds" title=""></span>
 <input id="q" placeholder="filter ip / process / host">
 <select id="f"><option value="all">all</option><option value="ext">external only</option><option value="flag">flagged only</option><option value="active">active only</option></select>
</header>
<div id="alert" hidden></div>
<main><table><thead><tr><th>Risk</th><th>Status</th><th>Proc (pid, user)</th><th>App</th><th>Local</th><th>Remote</th><th>Owner (ASN)</th><th>Age</th><th>Flags</th><th></th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const $=id=>document.getElementById(id);let data=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const age=ms=>{const s=Math.floor(ms/1000);return s<60?s+'s':s<3600?Math.floor(s/60)+'m':Math.floor(s/3600)+'h'};
function render(){
 if(!data)return;const q=$('q').value.toLowerCase(),f=$('f').value;
 let l=data.sessions;
 $('n').textContent=l.length;$('ne').textContent=l.filter(s=>s.external).length;$('nf').textContent=l.filter(s=>s.sev).length;
 l=l.filter(s=>(f==='all'||(f==='ext'&&s.external)||(f==='flag'&&s.sev)||(f==='active'&&s.status==='active'))
  &&(!q||[s.remote,s.proc,s.host,s.owner,s.exe,s.app,s.sni].join(' ').toLowerCase().includes(q)));
 const bad=data.sessions.filter(s=>s.flags.some(f=>f[2]==='feed'&&f[0]==='high')&&s.status==='active');
 notify(bad);
 $('alert').hidden=!bad.length;
 $('alert').innerHTML=bad.length?'<b>'+bad.length+' active connection(s) to known-malicious IPs:</b> '+bad.map(s=>esc((s.proc||'unknown')+' → '+s.remote+' ('+(s.asn||'?')+' '+(s.org||'')+')')).join(' · '):'';
 const i=data.intel,ok=Object.values(i.feeds).filter(f=>f.ok).length,n=Object.keys(i.feeds).length;
 $('feeds').innerHTML='threat feeds <b>'+(i.updated?ok+'/'+(n||i.feedDefs.length):'loading…')+'</b>'+(i.updated?' · '+i.total.toLocaleString()+' entries · updated '+age(data.t-i.updated)+' ago':'');
 const bk=data.block;$('feeds').innerHTML+=' · blocking <b>'+(bk.available?(bk.auto?'auto':'manual'):'off')+'</b> ('+Object.keys(bk.list).length+' rules)';
 const c=data.capture,p=data.policy,bl=data.baseline;
 $('feeds').innerHTML+=' · baseline <b>'+(bl.learning?'learning ('+Math.max(1,Math.ceil((bl.until-data.t)/60000))+'m left)':'active')+'</b> ('+bl.procs+' programs)';
 $('feeds').innerHTML+=' · '+esc(data.platform)+' · App-ID <b style="color:var(--'+(c.running?'ok':'med')+')">'+(c.running?'capturing ('+c.packets+' pkts)':'ports only')+'</b>'+(c.error&&!c.running?' <span class="mut">('+esc(c.error)+')</span>':'')
  +' · policy <b>'+p.rules+'</b> rules'+(p.enforce?' <b>enforcing</b>':' (monitor)')+(p.error?' <span style="color:var(--hi)">'+esc(p.error)+'</span>':'');
 $('feeds').title=i.feedDefs.map(d=>{const f=i.feeds[d.id]||{};return d.name+': '+(f.ok?f.count+' entries':'FAILED '+(f.error||''))}).join('\n');
 $('rows').innerHTML=l.map(s=>`<tr class="s${s.sev} ${s.status}">
  <td>${['—','low','MED','HIGH'][s.sev]}</td>
  <td><span class="st ${s.state}">${esc(s.proto)} ${esc(s.state)}</span>${s.status==='closed'?' <span class="mut">closed</span>':''}</td>
  <td title="${esc(s.exe||'')}&#10;${esc(s.cmd||'')}">${s.proc?esc(s.proc):'<span class="mut">unknown</span>'} <span class="mut">${s.pid??''} ${esc(s.user||'')}</span></td>
  <td><b>${esc(s.app)}</b><div class="mut" title="identified by ${esc(s.appVia||'')}${s.ja3?'&#10;JA3 '+esc(s.ja3):''}">${esc(s.sni||'')}</div></td>
  <td class="mut">${esc(s.local)}</td><td>${esc(s.remote)}</td>
  <td>${!s.external?'<span class="mut">local/private</span>':`${s.asn?`<b>${esc(s.asn)}</b> ${esc(s.org||'')} <span class="mut">${esc(s.cc||'')}</span>`:'<span class="mut">looking up…</span>'}${s.cloud?'<span class="cloud" title="Cloud/hosting provider: ownership alone proves nothing, judge by feed hits">cloud</span>':''}<div class="mut">${esc(s.host||'')}</div>`}</td>
  <td class="mut">${age(data.t-s.first)}</td>
  <td>${s.blocked?'<span class="tag high">BLOCKED</span>':''}${s.flags.map(([sv,m,t])=>`<span class="tag ${sv}${t==='feed'?' feedhit':''}">${esc(m)}</span>`).join('')}</td>
  <td>${s.external?(s.blocked?`<button data-a="unblock" data-ip="${esc(s.rip)}">unblock</button>`:`<button data-a="block" data-ip="${esc(s.rip)}">block</button>`):''}</td></tr>`).join('');
}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;
 if(b.dataset.a==='block'&&!confirm('Drop all outbound traffic to '+b.dataset.ip+'?'))return;
 const r=await fetch('/api/'+b.dataset.a,{method:'POST',headers:{'X-Netwatch':'1','Content-Type':'application/json'},body:JSON.stringify({ip:b.dataset.ip})});
 if(!r.ok)alert((await r.json()).err||'failed')});
const notified=new Set();let flash=null;
function notify(bad){const fresh=bad.filter(s=>!notified.has(s.id));fresh.forEach(s=>notified.add(s.id));if(!fresh.length)return;
 if('Notification' in window&&Notification.permission==='granted')new Notification('Netwatch: malicious IP contacted',{body:fresh.map(s=>(s.proc||'unknown')+' → '+s.remote+(s.blocked?' (blocked)':'')).join('\n')});
 try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch{}
 clearInterval(flash);let n=0;flash=setInterval(()=>{document.title=n++%2?'Netwatch':'⚠ MALICIOUS IP';if(n>10){clearInterval(flash);document.title='Netwatch'}},700)}
if('Notification' in window&&Notification.permission==='default')document.addEventListener('click',()=>Notification.requestPermission(),{once:true});
$('q').oninput=$('f').onchange=render;
function connect(){const es=new EventSource('/events');
 es.onopen=()=>{$('dot').className='dot on';$('conn').textContent='live'};
 es.onmessage=e=>{data=JSON.parse(e.data);render()};
 es.onerror=()=>{$('dot').className='dot';$('conn').textContent='reconnecting'}}
connect();
</script></body></html>
